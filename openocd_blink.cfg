# OpenOCD 启动脚本 —— blink_demo / STM32U575 / NUCLEO-U575ZI-Q
# 用法：CLion Debug Profile 里引用这个文件，或命令行：
#   openocd -f interface/stlink.cfg -f target/stm32u5x.cfg -c "source D:/STM32/blink_demo/openocd_blink.cfg"
# 或者直接：
#   openocd -f D:/STM32/blink_demo/openocd_blink.cfg

source [find interface/stlink.cfg]
source [find target/stm32u5x.cfg]

# 初始化 + 停在复位状态（等 gdb 连上再跑）
init
reset halt
